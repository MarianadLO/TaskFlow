<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dist/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TaskFlow</h1>
            <p>gerenciando sua rotina</p>
        </header>
        <main>
            <section class="estatistica">

                    <div class="stat-card">
                        <span>0</span>
                        <p>Total</p>
                    </div>

                <div class="stat-card">
                    <span>0</span>
                    <p>Concluídas</p>
                </div>

                <div class="stat-card">
                    <span>0</span>
                    <p>Pendentes</p>
                </div>
            </section>
            <section class="form">
                <form>
                    <div class="form_tarefa">
                        <label for="tarefa_titulo"></label>
                        <input type="text" id="tarefa_titulo" name="tarefa_titulo" placeholder="Digite sua tarefa">
                    </div>
                    <div class="form_categoria">
                        <label for="tarefa_categoria"></label>
                        <select id="tarefa_categoria" name="tarefa_categoria">
                            <option>Categoria</option>
                            <option>Estudos</option>
                            <option>Trabalho</option>
                            <option>Pessoal</option>
                            <option>Outros</option>
                        </select>
                    </div>
                    <div class="form_prioridade">
                        <label for="tarefa_prioridade"></label>
                        <select id="tarefa_prioridade" name="tarefa_prioridade">
                            <option>Prioridade</option>
                            <option>Alta</option>
                            <option>Média</option>
                            <option>Baixa</option>
                        </select>
                    </div>
                    <div class="button_form">
                        <button type="submit">Adicionar tarefa</button>
                    </div>
                </form>
            </section>
            <section class="tabs">
                <ul>
                    <li>
                        <button class="tabs-options">Todas</button>
                    </li>
                    <li>
                        <button class="tabs-options">Estudos</button>
                    </li>
                    <li>
                        <button class="tabs-options">Trabalho</button>
                    </li>
                    <li>
                        <button class="tabs-options">Pessoal</button>
                    </li>
                    <li>
                        <button class="tabs-options">Outros</button>
                    </li>
                    <li>
                        <button class="tabs-options">Concluídas</button>
                    </li>
                </ul>
            </section>
            <section class="task">
                <div class="task-list">
                    <ul>
                        <li>
                            <input type="checkbox" name="finish-task">
                            <h2>Estudar português</h2>
                            <p>Alta</p>
                            <p>Estudos</p>
                        </li>   
                    </ul>
                    <div>
                        <p></p>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
